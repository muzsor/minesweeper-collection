<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7d4f"/>
      <stop offset="1" stop-color="#1b4a2e"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5a5f66"/>
      <stop offset="0.55" stop-color="#23262b"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 背景淡淡的格線，暗示棋盤 -->
