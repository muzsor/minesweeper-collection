  <g transform="translate(256 268)" fill="#15171a">
    <rect x="-14" y="-190" width="28" height="380" rx="8"/>
    <rect x="-190" y="-14" width="380" height="28" rx="8"/>
    <rect x="-14" y="-190" width="28" height="380" rx="8" transform="rotate(45)"/>
    <rect x="-14" y="-190" width="28" height="380" rx="8" transform="rotate(-45)"/>
  </g>
  <circle cx="256" cy="268" r="132" fill="url(#ball)"/>
  <circle cx="212" cy="222" r="34" fill="rgba(255,255,255,0.85)"/>
  <!-- 引信頭的小紅旗，點出「插旗」 -->
  <g transform="translate(340 96)">
    <rect x="-5" y="0" width="10" height="92" rx="4" fill="#f3f3f3"/>
