<!DOCTYPE html>
<html lang="zh-Hant" data-table="green">
<head>
  <meta charset="utf-8">
  <title>踩地雷合集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="經典踩地雷與每日挑戰。免費、無廣告、可離線。">
  <meta name="theme-color" content="#1b4a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- default：內容不延伸到狀態列底下。black-translucent 在 iOS 26+ 會被系統鋪上無法關閉的 Liquid Glass 模糊。
       default 下橫向會隱藏狀態列、轉回直向後 WebKit 的觸控座標可能停在橫向的位置，由 app.js 的 installRotationFix 補救。
       狀態列顏色：iOS 26 起不再讀 theme-color，改為取樣最上方 fixed 元素的 background-color，所以用 #statusbar-tint 給它標題列的顏色 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="踩地雷">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div id="home" class="screen">
    <header class="topbar">
      <h1><img class="logo" src="./icons/icon.svg" alt="">踩地雷合集</h1>
      <button id="btn-stats-home" class="icon" title="統計">▤</button>
      <button id="btn-settings" class="icon" title="設定">⚙</button>
    </header>
    <main id="game-list"></main>
    <footer class="home-foot"><span class="install-hint">在 Safari 用「分享 → 加入主畫面」安裝，之後可離線遊玩<br></span><span id="app-version"></span></footer>
  </div>

  <div id="game" class="screen hidden">
    <header class="topbar">
      <button id="btn-back" class="icon" title="回選單">‹</button>
      <div class="title"><span id="g-title"></span><span id="g-sub"></span></div>
      <div class="hud"><span id="hud-time">00:00</span><span id="hud-mines">💣 0</span></div>
    </header>
    <div class="game-body">
      <div id="table"></div>
      <nav class="actions">
        <button id="btn-undo">↶<small>復原</small></button>
        <button id="btn-hint">✧<small>提示</small></button>
        <button id="btn-flag">🚩<small>插旗</small></button>
        <button id="btn-new">✦<small>新局</small></button>
        <button id="btn-menu">☰<small>選單</small></button>
      </nav>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>
  <!-- 1px 高、貼齊最上方的 fixed 元素，只用來讓 iOS 26+ 把狀態列塗成標題列的顏色，顏色由 app.js 設定 -->
  <div id="statusbar-tint"></div>

  <script src="./version.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
